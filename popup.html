<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mybili Cookie 助手</title>
    <style>
        :root {
            --bili-pink: #fb7299;
            --bili-pink-hover: #fc8bab;
            --bili-blue: #00aeec;
            --bili-blue-hover: #26bef5;
            --bg-color: #f6f7f8;
            --card-bg: #ffffff;
            --text-main: #18191c;
            --text-sub: #61666d;
            --text-muted: #9499a0;
            --border-color: #e3e5e7;
            --success-color: #16a34a;
            --success-bg: #dcfce7;
            --error-color: #dc2626;
            --error-bg: #fee2e2;
            --warn-color: #d97706;
            --warn-bg: #fef3c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 350px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 13px;
            line-height: 1.4;
        }

        .container {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 顶部标题栏 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 4px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand img {
            width: 24px;
            height: 24px;
            border-radius: 6px;
        }

        .brand-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 500;
            background-color: #e5e7eb;
            color: var(--text-sub);
            cursor: pointer;
            user-select: none;
            transition: opacity 0.15s;
        }

        .status-badge:hover {
            opacity: 0.85;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: currentColor;
        }

        .status-badge.online {
            background-color: var(--success-bg);
            color: var(--success-color);
        }

        .status-badge.offline {
            background-color: var(--error-bg);
            color: var(--error-color);
        }

        .status-badge.checking {
            background-color: var(--warn-bg);
            color: var(--warn-color);
        }

        /* 卡片容器 */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* 输入框与按钮 */
        .input-group {
            display: flex;
            gap: 6px;
        }

        input[type="text"] {
            flex: 1;
            height: 32px;
            padding: 0 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--bili-blue);
        }

        button {
            height: 32px;
            padding: 0 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: background-color 0.2s, opacity 0.2s;
            white-space: nowrap;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #eef1f5;
            color: var(--text-main);
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #e1e5eb;
        }

        .btn-primary {
            background-color: var(--bili-pink);
            color: #ffffff;
            width: 100%;
            height: 34px;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--bili-pink-hover);
        }

        .btn-text {
            background: transparent;
            color: var(--text-muted);
            height: auto;
            padding: 2px 4px;
            font-size: 11px;
            font-weight: 400;
        }

        .btn-text:hover:not(:disabled) {
            color: var(--error-color);
        }

        /* 提示消息栏 */
        .toast {
            display: none;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.35;
            word-break: break-word;
        }

        .toast.show {
            display: block;
        }

        .toast.success {
            background-color: var(--success-bg);
            color: var(--success-color);
        }

        .toast.error {
            background-color: var(--error-bg);
            color: var(--error-color);
        }

        .toast.info {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        /* 历史记录列表 */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 190px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background-color: #d1d5db;
            border-radius: 4px;
        }

        .history-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 7px 9px;
            border-radius: 6px;
            background-color: var(--bg-color);
            border-left: 3px solid transparent;
        }

        .history-item.success {
            border-left-color: var(--success-color);
        }

        .history-item.fail {
            border-left-color: var(--error-color);
        }

        .history-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
        }

        .history-tags {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tag {
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .tag.ok {
            background-color: var(--success-bg);
            color: var(--success-color);
        }

        .tag.err {
            background-color: var(--error-bg);
            color: var(--error-color);
        }

        .tag.trigger {
            background-color: #e5e7eb;
            color: var(--text-sub);
            font-weight: 500;
        }

        .history-time {
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .history-msg {
            font-size: 11.5px;
            color: var(--text-sub);
            word-break: break-all;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 18px 0;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部栏 -->
        <div class="header">
            <div class="brand">
                <img src="logo.png" alt="logo">
                <span class="brand-title">mybili Cookie</span>
            </div>
            <div id="statusBadge" class="status-badge" title="点击刷新服务端登录状态">
                <span class="status-dot"></span>
                <span id="statusText">未检测</span>
            </div>
        </div>

        <!-- 服务地址与操作卡片 -->
        <div class="card">
            <div class="section-label">
                <span>mybili 服务地址 (API URL)</span>
            </div>
            <div class="input-group">
                <input type="text" id="inputAPIHost" placeholder="例如 https://mybili.example.com">
                <button id="saveHostBtn" class="btn-secondary">保存</button>
            </div>
            <button id="uploadNowBtn" class="btn-primary">立即上传一次 Cookie</button>
            <div id="toastBox" class="toast"></div>
        </div>

        <!-- 上传历史卡片 -->
        <div class="card">
            <div class="section-label">
                <span>Cookie 上传历史</span>
                <button id="clearHistoryBtn" class="btn-text" title="清空所有历史记录">清空记录</button>
            </div>
            <div id="historyList" class="history-list">
                <div class="empty-state">暂无上传记录</div>
            </div>
        </div>
    </div>
    <script type="module" src="popup.mjs"></script>
</body>
</html>
